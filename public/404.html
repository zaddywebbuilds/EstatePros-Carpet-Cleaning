<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E2A23" />
    <link rel="icon" type="image/svg+xml" href="/Jose-Cardoso-Cleaning-Service/favicon.svg" />

    <title>Jose Cardoso Cleaning Service | Carpet & Deep Cleaning, North York</title>
    <meta name="description" content="Jose Cardoso Cleaning Service provides carpet, upholstery and deep cleaning for homes and businesses across North York and Toronto. Call (438) 922-6861 or request a quote." />

    <!--
      GitHub Pages serves this file for EVERY route other than the root, so a
      link preview for /services, /reviews and the rest is built from these
      tags. Crawlers never run the redirect script below, so without them a
      shared deep link previews as a bare hostname. Keep in step with
      index.html. og:image must be an absolute JPEG: WhatsApp will not render
      WebP in a preview.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jose Cardoso Cleaning Service" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:url" content="https://zaddywebbuilds.github.io/Jose-Cardoso-Cleaning-Service/" />
    <meta property="og:title" content="Jose Cardoso Cleaning Service | North York, Toronto" />
    <meta property="og:description" content="Carpet, upholstery and deep cleaning for homes and businesses across North York and Toronto." />
    <meta property="og:image" content="https://zaddywebbuilds.github.io/Jose-Cardoso-Cleaning-Service/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jose Cardoso Cleaning Service, North York Toronto, carpet upholstery and deep cleaning, (438) 922-6861" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jose Cardoso Cleaning Service | North York, Toronto" />
    <meta name="twitter:description" content="Carpet, upholstery and deep cleaning for homes and businesses across North York and Toronto." />
    <meta name="twitter:image" content="https://zaddywebbuilds.github.io/Jose-Cardoso-Cleaning-Service/og-image.jpg" />
    <meta name="twitter:image:alt" content="Jose Cardoso Cleaning Service, North York Toronto, carpet upholstery and deep cleaning, (438) 922-6861" />

    <script type="text/javascript">
      // GitHub Pages SPA redirect: preserves paths/query for React Router
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <noscript>
      <p>
        This site needs JavaScript to load its pages.
        <a href="https://zaddywebbuilds.github.io/Jose-Cardoso-Cleaning-Service/">
          Go to the Jose Cardoso Cleaning Service home page
        </a>.
      </p>
    </noscript>
  </body>
</html>
