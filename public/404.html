<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102C33" />
    <link rel="icon" type="image/svg+xml" href="/EstatePros-Carpet-Cleaning/favicon.svg" />

    <title>EstatePros Carpet Cleaning Calgary | Professional Carpet Care</title>
    <meta name="description" content="EstatePros Carpet Cleaning serves Calgary, Alberta with thoughtful, professional carpet care for the spaces you live and work in. Request a quote today." />

    <!--
      GitHub Pages serves this file for EVERY route other than the root, so a
      link preview for /services, /reviews and the rest is built from these
      tags. Crawlers never run the redirect script below, so without them a
      shared deep link previews as a bare hostname. Keep in step with
      index.html. og:image must be an absolute JPEG: WhatsApp will not render
      WebP in a preview.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EstatePros Carpet Cleaning" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:url" content="https://zaddywebbuilds.github.io/EstatePros-Carpet-Cleaning/" />
    <meta property="og:title" content="EstatePros Carpet Cleaning | Calgary, Alberta" />
    <meta property="og:description" content="Thoughtful carpet care for the spaces you live and work in. Serving Calgary, Alberta." />
    <meta property="og:image" content="https://zaddywebbuilds.github.io/EstatePros-Carpet-Cleaning/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="768" />
    <meta property="og:image:height" content="402" />
    <meta property="og:image:alt" content="Calgary living room with pale wall-to-wall carpet and daylight through tall windows" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EstatePros Carpet Cleaning | Calgary, Alberta" />
    <meta name="twitter:description" content="Thoughtful carpet care for the spaces you live and work in. Serving Calgary, Alberta." />
    <meta name="twitter:image" content="https://zaddywebbuilds.github.io/EstatePros-Carpet-Cleaning/og-image.jpg" />
    <meta name="twitter:image:alt" content="Calgary living room with pale wall-to-wall carpet and daylight through tall windows" />

    <script type="text/javascript">
      // GitHub Pages SPA redirect: preserves paths/query for React Router
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <noscript>
      <p>
        This site needs JavaScript to load its pages.
        <a href="https://zaddywebbuilds.github.io/EstatePros-Carpet-Cleaning/">
          Go to the EstatePros Carpet Cleaning home page
        </a>.
      </p>
    </noscript>
  </body>
</html>
